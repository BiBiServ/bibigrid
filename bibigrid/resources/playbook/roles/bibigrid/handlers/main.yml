- name: Nfs-server
  command:
    cmd: exportfs -ra
#  systemd:
#    name: nfs-kernel-server
#    state: restarted

- name: Docker
  systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - docker.socket
    - docker

- name: Restart munge
  systemd:
    name: munge
    state: restarted

- name: Restart slurmdbd
  systemd:
    name: slurmdbd
    state: restarted

- name: Restart slurmctld
  systemd:
    name: slurmctld
    state: restarted
  when: "'master' in group_names"

- name: Restart slurmrestd
  systemd:
    name: slurmrestd
    state: restarted
    daemon_reload: true

- name: Reconfigure slurmctld
  command: scontrol reconfigure
  when: "'master' in group_names"

- name: Enable slurmd
  systemd:
    name: slurmd
    enabled: true
    masked: false
    state: started
    daemon_reload: true

- name: Restart slurmd
  systemd:
    name: slurmd
    state: restarted

- name: Zabbix-agent2
  systemd:
    name: zabbix-agent2
    state: restarted

- name: Zabbix-server
  systemd:
    name: zabbix-server
    state: restarted

- name: Apache2
  systemd:
    name: apache2
    state: restarted

- name: Systemd-networkd restart
  service:
    name: systemd-networkd
    state: restarted
    enabled: true
  become: true

- name: Reload wireguard configuration
  when: "'wg0' in ansible_interfaces"
  become: true
  shell:
    cmd: "bash -c 'wg syncconf wg0 <(wg-quick strip wg0)'"

- name: Dnsmasq
  systemd:
    name: dnsmasq
    state: restarted

- name: Netplan apply
  command: netplan apply

- name: Apt update
  apt:
    update_cache: "yes"

- name: Nvidia drivers installed
  reboot:
    reboot_timeout: 900
    pre_reboot_delay: 5
    post_reboot_delay: 20
    test_command: nvidia-smi
