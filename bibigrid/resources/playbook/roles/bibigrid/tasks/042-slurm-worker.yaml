- name: Copy system overrides (slurmd)
  template:
    src: "slurm/systemd/slurmd.override.j2"
    dest: "/etc/systemd/system/slurmd.service.d/override.conf"
    mode: "0o644"
    owner: root
    group: root

- name: Enable slurmd services
  systemd:
    name: "slurmd"
    enabled: true
    masked: false
    state: started
    daemon_reload: true
